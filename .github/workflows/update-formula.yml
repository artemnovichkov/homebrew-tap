name: Update Formula
on:
  repository_dispatch:
    types: [update-formula]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update formula
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
          URL: ${{ github.event.client_payload.url }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          FILE="Formula/${FORMULA}.rb"
          [[ -f "$FILE" ]] || { echo "No formula: $FILE"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid sha256: $SHA256"; exit 1; }
          sed -i "s|^  url \".*\"|  url \"${URL}\"|" "$FILE"
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" "$FILE"
      - name: Commit and push
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA}.rb"
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update ${FORMULA} to ${VERSION}"
          git push
